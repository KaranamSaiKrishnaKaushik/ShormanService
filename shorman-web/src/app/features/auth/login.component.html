<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🛒</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your Shorman account with Auth0</p>
    </div>

    <p class="auth-copy">
      Continue with your configured Auth0 login method. Your browser will be redirected to the hosted login page and then back to Shorman.
    </p>

    <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

    <div class="divider"><span>or</span></div>

    <button class="btn-google" (click)="loginWithGoogle()" [disabled]="loading">
      <span class="google-icon">G</span>
      {{ loading ? 'Redirecting…' : 'Continue with Auth0' }}
    </button>

    <div class="auth-footer">
      Need an Auth0 sign-up flow later? <a routerLink="/register">Open the sign-up entry</a>
    </div>
  </div>
</div>
